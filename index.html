<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    .form-container {
      max-width: 450px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      font-size: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #45a049;
    }
    #response { text-align: center; margin-top: 10px; font-weight: bold; }
  </style>
</head>

<body>

  <div class="form-container">
    <h2>Contact Us</h2>

    <form id="contactForm">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <input type="text" name="phone" placeholder="Phone" required />
      <input type="text" name="service" placeholder="Service Needed" />
      <textarea name="message" placeholder="Your Message" rows="4"></textarea>

      <button type="submit">Submit</button>
    </form>

    <p id="response"></p>
  </div>

  <script>
    const scriptURL = "YOUR_WEB_APP_URL_HERE"; // ← PUT YOUR /exec URL

    document.getElementById("contactForm").addEventListener("submit", (e) => {
      e.preventDefault();

      fetch(scriptURL, {
        method: "POST",
        body: new FormData(e.target) // ← NO JSON, NO HEADERS (CORS-SAFE)
      })
      .then(res => res.text())
      .then(() => {
        document.getElementById("response").innerText = "Form Submitted Successfully!";
        e.target.reset();
      })
      .catch(() => {
        document.getElementById("response").innerText = "Error submitting form.";
      });
    });
  </script>

</body>
</html>

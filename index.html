<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Contact Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    .form-container {
      max-width: 450px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    input, textarea, button {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      font-size: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #45a049;
    }

    #response {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <h2>Contact Us</h2>

    <form id="contactForm">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <input type="text" name="phone" placeholder="Phone" required />
      <input type="text" name="service" placeholder="Service Needed" />
      <textarea name="message" placeholder="Your Message" rows="4"></textarea>

      <button type="submit">Submit</button>
    </form>

    <p id="response"></p>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzd0u86RyMmMa6AwLWk9X_1Raqe3obQPCT-WdIZU415U-kTHanlZLyWh1B_XxZryCFrYQ/exec"; // <--- paste your Web App URL

    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      let data = {
        name: e.target.name.value,
        email: e.target.email.value,
        phone: e.target.phone.value,
        service: e.target.service.value,
        message: e.target.message.value
      };

      try {
        const res = await fetch(scriptURL + "?origin=" + location.origin, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const json = await res.json();
        document.getElementById("response").innerText = "Form submitted successfully!";

        e.target.reset();
      } catch (err) {
        document.getElementById("response").innerText = "Error submitting the form.";
      }
    });
  </script>

</body>
</html>
